spring:
  application:
    name: team-task-manager-backend
  
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/tms_db
    username: ${DB_USERNAME:tms_user}
    password: ${DB_PASSWORD:tms_password}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
      max-acquire-time: 30s
      max-create-connection-time: 30s
  
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/tms_db
    user: ${DB_USERNAME:tms_user}
    password: ${DB_PASSWORD:tms_password}
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@sprinto.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    ru.get.tms: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-min-256-bits}
  # Access token expiration: 30 minutes (1800000 ms) - FR-007.3, NFR-020
  # User session expires after 30 minutes of inactivity
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  # Refresh token expiration: 7 days (604800000 ms)
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
  password-reset:
    token-validity-hours: 1

